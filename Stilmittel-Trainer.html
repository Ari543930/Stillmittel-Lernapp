<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Stilmittel-Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@1,7..72,400&display=swap">
<style>
/* Layout: ruhige App — feste Kopfleiste mit Tabs, eine Inhaltsspalte, Flächen nur wo sie gruppieren */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --ink:#141a33; --muted:#6a7393; --line:#e3e6f0;
  --accent:#3349c4; --accent-soft:#eef0fc; --on-accent:#ffffff;
  --good:#16845a; --good-soft:#e4f4ec; --bad:#c2372d; --bad-soft:#fcecea; --mark:#fde58a; --mark-ink:#141a33;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-quote:"Literata",Georgia,"Times New Roman",serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1224; --surface:#181c33; --ink:#e9ebf7; --muted:#959cbd; --line:#272c4a;
  --accent:#8a9cff; --accent-soft:#222a52; --on-accent:#0f1224;
  --good:#5ccf98; --good-soft:#15362a; --bad:#ff8b81; --bad-soft:#3a1b21; --mark:#e6cc45; --mark-ink:#141a33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1224; --surface:#181c33; --ink:#e9ebf7; --muted:#959cbd; --line:#272c4a;
  --accent:#8a9cff; --accent-soft:#222a52; --on-accent:#0f1224;
  --good:#5ccf98; --good-soft:#15362a; --bad:#ff8b81; --bad-soft:#3a1b21; --mark:#e6cc45; --mark-ink:#141a33; color-scheme:dark}
/* Eigene Farbwahl aus den Einstellungen: schlägt das Theme der Umgebung */
html:root[data-bg="light"]{--bg:#f5f6fa; --surface:#ffffff; --ink:#141a33; --muted:#6a7393; --line:#e3e6f0;
  --accent:#3349c4; --accent-soft:#eef0fc; --on-accent:#ffffff;
  --good:#16845a; --good-soft:#e4f4ec; --bad:#c2372d; --bad-soft:#fcecea; --mark:#fde58a; --mark-ink:#141a33; color-scheme:light}
html:root[data-bg="dark"]{--bg:#0f1224; --surface:#181c33; --ink:#e9ebf7; --muted:#959cbd; --line:#272c4a;
  --accent:#8a9cff; --accent-soft:#222a52; --on-accent:#0f1224;
  --good:#5ccf98; --good-soft:#15362a; --bad:#ff8b81; --bad-soft:#3a1b21; --mark:#e6cc45; --mark-ink:#141a33; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.inner{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopfleiste */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .inner{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:15px;font-weight:700}
.pill{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.pill .bar{width:70px}
nav{display:flex;gap:4px;width:100%;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 12px 12px;color:var(--muted);font-weight:700}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}

main.inner{padding-block:28px 64px;display:grid;gap:28px}

/* Grundbausteine */
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:default}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.sec{display:grid;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:20px}
.muted{color:var(--muted)}
.small{font-size:14px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.chk{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:16px;height:16px}
input[type=text],input[type=search]{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;width:100%}
.quote{font-family:var(--f-quote);font-style:italic}
.mark{background:var(--mark);color:var(--mark-ink);padding:0 5px;border-radius:4px;font-style:normal;font-family:var(--f-body);font-weight:700;font-size:.85em}
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}

/* Startseite */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.hero h1{font-size:clamp(26px,5vw,34px);line-height:1.15}
.hero .big-n{color:var(--good)}
.hero-txt{display:grid;gap:14px;min-width:0}
.ring{width:120px;height:120px}
.ring circle{fill:none;stroke-width:10}
.ring text{font-family:var(--f-display);font-weight:700;font-size:22px;fill:var(--ink)}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero .ring{display:none}}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--accent);transform:translateY(-1px)}
.mode .ic{grid-row:span 2;width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mode .ic svg{width:22px;height:22px}
.mode b{font-family:var(--f-display);font-size:17px}
.mode span{color:var(--muted);font-size:14px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:14px;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.done{background:var(--good-soft);border-color:transparent;color:var(--good);font-weight:700}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.weak{display:grid}
.weak button{display:flex;justify-content:space-between;gap:12px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;text-align:left}
.weak button:first-child{border-top:0}
.weak b{font-family:var(--f-display);font-size:16px}
.weak .nums{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}

/* Alle Begriffe */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0;color:transparent;font-size:13px;font-weight:700}
.tick:hover{border-color:var(--good)}
.item.done .tick{background:var(--good);border-color:var(--good);color:var(--surface)}
.nm{font-family:var(--f-display);font-weight:700;font-size:17px}
.nm small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.item .ex{grid-column:2;color:var(--muted);font-size:15px;min-width:0}
.item .more{grid-column:3;grid-row:1}
.item .det{grid-column:2/4;display:grid;gap:8px;margin-top:8px;padding:14px;background:var(--bg);border-radius:12px;font-size:15px}

/* Lernkarten */
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.cbar{flex:1 1 140px}
.card{perspective:1400px;cursor:pointer;outline:none}
.card-in{position:relative;min-height:340px;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;overflow:auto;box-shadow:0 1px 2px rgba(20,26,51,.04),0 8px 24px -12px rgba(20,26,51,.12)}
.face.back{transform:rotateY(180deg)}
.face.front{justify-content:center;align-items:center;text-align:center}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,8vw,46px);letter-spacing:-.02em;line-height:1.1}
.fq{font-size:19px;line-height:1.55;max-width:56ch}
.fq div+div{margin-top:8px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* Spiele */
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:max-content;max-width:100%}
.seg button{border:0;background:none;border-radius:10px;padding:8px 14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.q{font-size:18px;margin:8px 0 20px;line-height:1.55}
.q.quote{font-size:21px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.opts button{text-align:left;padding:13px 16px;font-family:var(--f-display);font-size:17px;font-weight:600}
.opts .good,.opts .bad{border-color:transparent}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;font-weight:700}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.mem{grid-template-columns:repeat(3,1fr)}}
.tile{min-height:100px;padding:10px;font-size:13px;line-height:1.35;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:12px;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--surface)}
.tile:hover{border-color:var(--accent)}
.tile.n{font-family:var(--f-display);font-weight:700;font-size:15px}
.tile.e{font-family:var(--f-quote);font-style:italic}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.tile.err{background:var(--bad-soft);border-color:var(--bad)}
.end{text-align:center;display:grid;gap:12px;justify-items:center;padding:16px 0}
/* Startseite schlank */
.hero-simple{display:grid;gap:18px;text-align:center;justify-items:center;padding:36px 22px}
.hero-simple .ring{width:150px;height:150px}
.hero-simple h1{font-size:clamp(24px,5vw,30px)}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mlist button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:14px 18px;text-align:left}
.mlist button:first-child{border-top:0}
.mlist button:hover{background:var(--accent-soft)}
.mlist .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.mlist .ic svg{width:20px;height:20px}
.mlist b{font-family:var(--f-display);font-size:16px;flex:1}
.mlist .arr{color:var(--muted)}
/* Einstellungen */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.sw{display:grid;gap:8px;justify-items:center;background:none;border:2px solid transparent;border-radius:14px;padding:10px 6px;font-size:13px;color:var(--muted)}
.sw:hover{border-color:var(--line)}
.sw.on{border-color:var(--accent);color:var(--ink);font-weight:700}
.sw .dot{width:48px;height:48px;border-radius:50%;border:1px solid rgba(128,128,150,.35)}
.sw .auto{background:linear-gradient(135deg,#f5f6fa 50%,#0f1224 50%)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
/* Handy-Anpassungen */
main.inner>*,.sec,.box,.tools>*{min-width:0}
.gear{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0;flex:none}
.gear svg{width:20px;height:20px}
.gear:hover,.gear.on{color:var(--accent);border-color:var(--accent)}
.seg.games-seg{display:grid;grid-template-columns:repeat(4,auto);width:max-content}
@media (max-width:560px){
  .top .inner{gap:10px}
  .pill .bar{width:44px}
  nav{gap:0}
  nav button{flex:1 1 auto;padding:10px 6px 12px;font-size:15px}
  main.inner{padding-block:20px 48px;gap:22px}
  .box{padding:18px}
  .seg.games-seg{grid-template-columns:1fr 1fr;width:100%}
  .seg button{padding:8px 10px}
  .q{font-size:17px}
  .q.quote{font-size:18px}
  .face{padding:20px}
  .fq{font-size:17px}
  .big{font-size:clamp(26px,9vw,40px)}
  .item{padding:12px 14px;gap:4px 10px}
  .mem{gap:6px}
  .tile{min-height:88px;padding:8px;font-size:12px}
  .tile.n{font-size:13px}
  .opts button{padding:12px 14px;font-size:16px}
}
@media (prefers-reduced-motion:reduce){.card-in,.mode,.bar i{transition:none}}
</style>
</head>
<body>


<header class="top">
  <div class="inner">
    <button class="brand" id="home" aria-label="Zur Startseite"><span class="logo">S</span>Stilmittel-Trainer</button>
    <div class="pill"><span id="pTxt">0/38</span><div class="bar"><i id="pBar" style="width:0"></i></div></div>
    <button class="gear" id="gear" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <nav id="nav">
      <button data-v="start" class="on">Start</button>
      <button data-v="karten">Lernkarten</button>
      <button data-v="spiele">Spiele</button>
      <button data-v="liste">Begriffe</button>
    </nav>
  </div>
</header>

<main class="inner" id="view"></main>

<script>
const D=[
{n:"Akkumulation",a:"die",h:"lat. Anhäufung",b:["„Was hülf mir Kron’ und Land und Gold und Ehre?“ (M. Claudius: Kriegslied)"],e:"Um stärkere Bildhaftigkeit zu erreichen, werden anstelle des Oberbegriffs mehrere Unterbegriffe aufgezählt."},
{n:"Allegorie",a:"die",h:"gr. allegorein = anders, bildlich reden",b:["die Taube als Allegorie des Friedens","Justitia als Allegorie der Gerechtigkeit"],e:"Übertragung von etwas Gedachtem (einer Idee) in ein Bild, oft als Personifikation."},
{n:"Alliteration",a:"die",h:"lat. littera = der Buchstabe",b:["Kind und Kegel; Land und Leute; rote Rosen"],e:"Klangfigur: gleicher Anlaut aufeinanderfolgender Wörter, die dadurch enger miteinander verknüpft werden. In der Werbung dient sie der größeren Einprägsamkeit."},
{n:"Anakoluth",a:"das (der)",h:"gr. anakoluthos = ohne Folge, Satzbruch",b:["„Es geschieht oft, dass, je freundlicher man ist, nur Undank wird einem zuteil.“"],e:"Die grammatische Bauform von Anfang und Ende eines Satzes stimmt nicht überein. Entweder Zeichen der Nachlässigkeit oder absichtsvolles Stilmittel."},
{n:"Anapher",a:"die",h:"gr. anaphora = Rückbeziehung, Wiederaufnahme",b:["„Wer nie sein Brot mit Tränen aß, / Wer nie die kummervollen Nächte / Auf seinem Bette weinend saß […]“ (Goethe: Harfenspieler)"],e:"Wiederholung eines Wortes oder einer Wortgruppe am Anfang mehrerer aufeinanderfolgender Sätze, Satzteile, Textabschnitte oder Verse zur syntaktischen Gliederung und rhetorischen Verstärkung."},
{n:"Antithese",a:"die",h:"gr. antithesis = Gegensatz",b:["Gut und Böse; Alt und Jung","„Der Wahn ist kurz, die Reu’ ist lang.“ (Schiller: Die Glocke)"],e:"Entgegenstellung: 1. als Gegenbehauptung zu einer These, 2. als Gegenüberstellung logisch entgegengesetzter Begriffe oder Aussagen; oft verstärkt durch Parallelismus oder Chiasmus."},
{n:"Chiasmus",a:"der",h:"nach dem griech. Buchstaben Chi = X, Überkreuzstellung",b:["„Die Kunst ist lang und kurz ist unser Leben.“ (Goethe: Faust 1)","„Eng ist die Welt und das Gehirn ist weit.“ (Schiller: Wallenstein)"],e:"Symmetrische Überkreuzstellung (spiegelbildliche Anordnung) von einander entsprechenden Satzgliedern, zur Verdeutlichung einer Antithese."},
{n:"Chiffre",a:"die",h:"frz. Ziffer, Zahl",b:["„Die schwarze Milch der Frühe“ (P. Celan: Todesfuge)","„Das blaue Wild“ (G. Trakl)"],e:"Ursprünglich ein Geheimzeichen, das mit einem „Schlüssel“ entziffert werden kann. In moderner Dichtung verrätselte Symbole: Sie verlieren ihre selbstverständliche Bedeutung und gewinnen ihren Sinn erst aus dem Textzusammenhang bzw. dem Assoziationsmuster des Dichters."},
{n:"Contradictio in adiecto",a:"die",h:"lat. Widerspruch im Beiwort",b:["„Die kleinere Hälfte.“","„Beredtes Schweigen.“"],e:"Sonderform des Oxymorons, bei der ein Widerspruch zwischen Substantiv und adjektivischem Beiwort besteht.",alt:["contradictio"]},
{n:"Correctio",a:"die",h:"lat. Verbesserung",b:["„Wir müssen darum unsere Stimme eindringlich, ja beschwörend erheben.“ (K. G. Kiesinger)"],e:"Selbstberichtigung zur Steigerung einer Aussage, indem ein schwächerer durch einen gewichtigeren Ausdruck ersetzt wird.",alt:["korrektio"]},
{n:"Ellipse",a:"die",h:"gr./lat. Auslassung, Mangel",b:["„Je schneller, desto besser.“","„Jung gewohnt, alt getan.“","„Woher so ein Atem?“ (Schiller: Fiesco)"],e:"Auslassung eines Satzteils, der zum Verständnis nicht unbedingt notwendig ist. In der Dichtung wird so oft ein gesteigertes Gefühl ausgedrückt oder eine Pointierung erreicht."},
{n:"Emphase",a:"die",h:"gr. emphasis = Verdeutlichung",b:["„Er ist ein Mensch“, d. h. entweder ein schwacher, irrender Mensch oder ein guter, edler Mensch."],e:"1. Nachdruck und Eindringlichkeit der Betonung und Gestik. 2. Figur des uneigentlichen Ausdrucks."},
{n:"Epipher",a:"die",h:"gr. epiphora = Zulage",b:["„Doch alle Lust will Ewigkeit / will tiefe, tiefe Ewigkeit!“ (Nietzsche)"],e:"Ausdrucksvolle Wiederholung desselben Wortes oder derselben Wortgruppe jeweils am Schluss mehrerer aufeinanderfolgender Sätze oder Satzglieder (Umkehr der Anapher)."},
{n:"Euphemismus",a:"der",h:"gr. euphemia = Sprechen guter Worte",b:["„Freund Hein“ für Tod","„das Zeitliche segnen“ für sterben","„Nullwachstum“ für Stagnation"],e:"Hüllwort. Beschönigende Umschreibung einer unangenehmen, anstößigen oder unheilbringenden Sache."},
{n:"Hendiadyoin",a:"das",h:"gr. eins durch zwei",b:["„Hilfe und Beistand“","„Betrübnis und Trauer“"],e:"Ein Begriff wird zur Verstärkung durch zwei gleichwertige, mit „und“ verbundene Wörter ausgedrückt."},
{n:"Hyperbel",a:"die",h:"gr. hyperbole = das Übermaß",b:["blitzschnell, Schneckentempo","„Ein Schneidergeselle, so dünn, dass die Sterne durchschimmern konnten […]“ (Heine: Harzreise)"],e:"Übertreibung des Ausdrucks in vergrößerndem oder verkleinerndem Sinne."},
{n:"Hypotaxe",a:"die",h:"gr. hypotaxis = Unterordnung",b:["„Der jüngere Hausherr hatte, als der allgemeine Aufbruch begann, mit der Hand nach der linken Brustseite gegriffen, wo ein Papier knisterte, […]“ (Th. Mann: Buddenbrooks)"],e:"Im Gegensatz zur Parataxe eine kunstvoll geschachtelte Syntax, in der die Gedanken in Hauptsätze und Nebensätze gegliedert sind und so ein komplexes Gefüge ergeben."},
{n:"Inversion",a:"die",h:"lat. inversio = Umkehrung",b:["Vater unser im Himmel","„Sah ein Knab’ ein Röslein stehn.“ (Goethe)"],e:"Von der üblichen Wortfolge abweichende Umstellung von Wörtern, oft zur Ausdrucksverstärkung, denn die Erststellung eines Wortes im Satz bewirkt besonderen Nachdruck."},
{n:"Ironie",a:"die",h:"gr. eironeia = Verstellung, Ausflucht",b:["„Eine schöne Bescherung!“ (gemeint: Skandal)"],e:"Redeweise, die das Gegenteil von dem meint, was sie sagt, und dadurch zum Nachdenken anregt oder auch provoziert."},
{n:"Katachrese",a:"die",h:"gr. katachresis = Missbrauch",b:["„Der Zahn der Zeit, der schon manche Träne getrocknet hat, wird auch über diese Wunde Gras wachsen lassen.“"],e:"Meist als Bild- oder Stilbruch durch die Verbindung metaphorischer Wendungen, die nicht zusammenpassen."},
{n:"Klimax",a:"die",h:"gr. klimax = Leiter, Treppe",b:["„veni, vidi, vici“ (ich kam, sah, siegte)","„Wie habe ich ihn nicht gebeten, gefleht, beschworen.“ (Lessing: Philotas)"],e:"Anordnung einer Wort- oder Satzreihe in kunstvoller Steigerung vom schwächeren zum stärkeren Ausdruck. Fällt die Reihe deutlich ab, liegt eine Antiklimax vor."},
{n:"Litotes",a:"die",h:"gr. Einfachheit, Schlichtheit",b:["„nicht übel“ (= gut)","„nicht gerade einer der Tapfersten“ (= ironisch für feige)"],e:"Durch untertreibende Ausdrucksweise (Understatement) oder Verneinung des Gegenteils wird etwas betont."},
{n:"Metapher",a:"die",h:"gr. metaphora = Übertragung",b:["Stuhlbein; Redefluss; Fuß des Berges; Auge des Gesetzes"],e:"Sprachlicher Ausdruck, bei dem ein Wort oder eine Wortgruppe aus dem ursprünglichen Bedeutungszusammenhang in einen anderen übertragen wird."},
{n:"Metonymie",a:"die",h:"gr. metonymia = Umbenennung, Namensvertauschung",b:["Das Weiße Haus, der Kreml meldet …","„Schiller lesen“ statt in Schillers Werken lesen"],e:"Ersetzt das eigentliche Wort durch ein anderes, das zu ihm in enger Beziehung steht."},
{n:"Onomatopoesie",a:"die",h:"gr. onoma = Name, poiein = schöpfen",b:["„stocksteif“, „knistern und knastern“","„So heult es verworren, und ächzet und girrt, und brauset und sauset und krächzet und klirrt.“ (Heine)"],e:"Laut- und Klangmalerei bei Wortbildungen, wobei vor allem akustische Eindrücke durch Sprache wiedergegeben werden.",alt:["onomatopoie","onomatopoeie","lautmalerei","klangmalerei"]},
{n:"Oxymoron",a:"das",h:"gr. oxys = scharf, moros = dumm",b:["alter Knabe; bittere Süße; traurigfroh; helldunkel","„Ein dunkler Ehrenmann“ (Goethe: Faust 1)"],e:"Verbindung zweier sich logisch ausschließender Begriffe, die in pointierter Absicht eng miteinander verbunden werden."},
{n:"Paradoxon",a:"das",h:"gr. paradoxos = unerwartet, unmöglich",b:["„Wer sein Leben gewinnen will, der wird es verlieren.“ (Matth. 10, 39)","„Das Leben ist der Tod und der Tod ist das Leben.“"],e:"Eine zunächst scheinbar widersinnige Behauptung, die aber bei genauerer Betrachtung auf eine höhere Wahrheit hinweist.",alt:["paradox"]},
{n:"Parallelismus",a:"der",h:"gr. parallelos = gleichlaufend",b:["„Heiß ist die Liebe, kalt ist der Schnee.“","„Gottes ist der Orient! Gottes ist der Okzident!“ (Goethe: West-östlicher Divan)"],e:"Im Gegensatz zum Chiasmus Wiederkehr derselben Wortreihenfolge in symmetrischer syntaktischer Konstruktion."},
{n:"Parataxe",a:"die",h:"gr. parataxis = Danebenstellen",b:["„Der König sprach’s, der Page lief; / Der Knabe kam, der König rief: […]“ (Goethe: Der Sänger)"],e:"Im Gegensatz zur Hypotaxe das Nebeneinanderstellen gleichberechtigter Hauptsätze, wodurch ein charakteristischer Rhythmus entsteht."},
{n:"Parenthese",a:"die",h:"gr. parenthesis = Einschub",b:["„So bitt ich – ein Versehen war’s, weiter nichts – / Für rasche Tat dich um Verzeihung.“ (Kleist: Penthesilea)"],e:"Grammatikalisch selbstständiger Einschub in einen Satz, der dessen Zusammenhang unterbricht, ohne die syntaktische Ordnung zu verändern."},
{n:"Periphrase",a:"die",h:"gr. periphrasis = Umschreibung",b:["„Jenes höhere Wesen, das wir verehren“ für Gott (H. Böll)","„Ein Land, darinnen Milch und Honig fließt“ für Israel (2. Mose 3,8)"],e:"Umschreibung einer Person, einer Sache, eines Begriffs durch mehrere kennzeichnende Wörter."},
{n:"Personifikation",a:"die",h:"lat. persona = Maske, Gestalt; facere = machen",b:["„Frau Welt“; „Gevatter Tod“; „Vater Rhein“","„[…] es kam die Nacht und blätterte gleichgültig in den Bäumen.“ (Rilke)"],e:"Vermenschlichung abstrakter Begriffe und lebloser Dinge, indem sie als sprechende und handelnde Personen auftreten.",alt:["personifizierung"]},
{n:"rhetorische Frage",a:"die",h:"gr. rhetor = Redner",b:["„Wer bist du, Fürst, dass …?“ (G. A. Bürger)","Seid ihr richtige Männer?"],e:"Scheinbare Frage, weil keine Antwort erwartet wird. Sie verstärkt die Eindringlichkeit der Aussage."},
{n:"Symbol",a:"das",h:"gr. symbolon = Kennzeichen; symballein = zusammenfügen",b:["Anker = Symbol der Hoffnung","Ring = Symbol der Treue"],e:"Bildhaftes Zeichen (Sinnbild), das über sich hinaus auf höhere geistige Zusammenhänge verweist; ein sinnlich fassbares Zeugnis für eine Idee, das einen abstrakten Begriff veranschaulicht."},
{n:"Synästhesie",a:"die",h:"gr. synaisthesis = das Zugleichempfinden",b:["schreiendes Rot; heiße Musik; coole Nummer","Die Brillengläser „waren so dick, dass die Augen ganz leise aussahen“. (W. Borchert)"],e:"Verschmelzung verschiedener Sinnesbereiche (Geruchs-, Gesichts-, Gehör- und Tastsinn) zur Steigerung der Aussage."},
{n:"Vergleich",a:"der",h:"",b:["Ein Mann wie eine Eiche! (Tertium comparationis: Größe bzw. Mächtigkeit)"],e:"Setzt zwei Bereiche durch die Vergleichspartikel „wie“ in Beziehung, die sich in einem dritten Punkt (tertium comparationis) gleichen. Erhöht die Anschaulichkeit."},
{n:"Wiederholung",a:"die",h:"lat. repetitio",b:["„O Mutter! Was ist Seligkeit? / O Mutter! Was ist Hölle?“ (G. A. Bürger: Lenore)"],e:"Steigerung der Eindringlichkeit durch erneutes Aufgreifen desselben Wortes.",alt:["repetitio"]},
{n:"Wortspiel",a:"das",h:"Paronomasie, gr. Wortumbildung zur Erreichung eines Nebensinns",b:["„Der Rheinstrom ist geworden zu einem Peinstrom, / Die Klöster sind ausgenommene Nester, / Die Bistümer sind verwandelt in Wüsttümer […]“ (Schiller)"],e:"Zusammenstellung gleichlautender oder ähnlicher Wörter von verschiedener oder entgegengesetzter Bedeutung, die irritieren und zum Nachdenken anregen soll.",alt:["paronomasie"]}
];
D.forEach((d,i)=>d.id=i);

/* ---------- Speicher ---------- */
const KEY="stilmittel-v1";
let S={done:{},st:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const isDone=id=>!!S.done[id];
const nDone=()=>D.filter(d=>isDone(d.id)).length;
function setDone(id,v){if(v)S.done[id]=1;else delete S.done[id];save();updProg();}
function rec(id,ok){const s=S.st[id]||(S.st[id]={r:0,f:0});ok?s.r++:s.f++;save();}
function updProg(){const n=nDone();$("#pTxt").textContent=n+"/"+D.length;$("#pBar").style.width=(n/D.length*100)+"%";}

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
function mask(txt,d){const t=esc(txt);const base=d.n.replace(/^rhetorische /,"");const stem=base.slice(0,Math.max(5,base.length-2));
  return t.replace(new RegExp(stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*","gi"),'<span class="mark">???</span>');}
function pool(onlyOpen){const p=onlyOpen?D.filter(d=>!isDone(d.id)):D.slice();return p.length?p:D.slice();}
function weighted(p){const w=p.map(d=>{const s=S.st[d.id]||{r:0,f:0};return Math.max(.3,1+s.f*2-Math.min(s.r,3)*.25+(isDone(d.id)?0:1));});
  let x=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<p.length;i++){x-=w[i];if(x<=0)return p[i];}return p[p.length-1];}
const norm=s=>s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/^(der|die|das)\s+/,"").replace(/[^a-z]/g,"");
let onlyOpen=false;
const openToggle=()=>`<label class="chk"><input type="checkbox" id="onlyOpen" ${onlyOpen?"checked":""}> Nur noch nicht gekonnte</label>`;
function bindOpen(cb){const el=$("#onlyOpen");if(el)el.onchange=()=>{onlyOpen=el.checked;cb();};}

const IC={
 karten:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2.5"/><path d="M7 3h11.5A2.5 2.5 0 0 1 21 5.5V17"/></svg>',
 bsp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h4l-2 5H4zM13 7h4l-2 5h-2z"/><path d="M4 18h16"/></svg>',
 erk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 11h6M9 15h6"/></svg>',
 tipp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M7 11h.01M11 11h.01M15 11h.01M8 15h8"/></svg>',
 mem:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><path d="M14.5 17.5l2 2 3.5-4"/></svg>'};

/* ---------- Navigation ---------- */
let cur="start";
function go(v,opt){cur=v;if(opt&&opt.game){game=opt.game;G=null;}if(opt&&opt.q!==undefined)q=opt.q;if(opt&&opt.open!==undefined){onlyOpen=opt.open;deck=[];G=null;}
  $$("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));$("#gear").classList.toggle("on",v==="settings");render();window.scrollTo(0,0);}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.v);};
$("#home").onclick=()=>go("start");
$("#gear").onclick=()=>go("settings");
function render(){confirmReset=false;({settings:vSettings,start:vStart,liste:vListe,karten:vKarten,spiele:vSpiele})[cur]();}

/* ---------- Startseite ---------- */
function vStart(){
  const n=nDone(),T=D.length,C=2*Math.PI*50,rest=T-n;
  const headline=n===0?"38 Stilmittel warten auf dich":n===T?"Alle 38 Stilmittel sitzen!":`Du kannst ${n} von ${T} Stilmitteln`;
  const modes=[{k:"karten",t:"Lernkarten"},{k:"bsp",t:"Erkennen"},{k:"erk",t:"Definition"},{k:"tipp",t:"Eintippen"},{k:"mem",t:"Paare finden"}];
  $("#view").innerHTML=`
  <section class="box hero-simple">
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="50" style="stroke:var(--line)"/>
      <circle cx="60" cy="60" r="50" style="stroke:var(--good);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;stroke-dasharray:${C};stroke-dashoffset:${C*(1-n/T)}"/>
      <text x="60" y="68" text-anchor="middle">${Math.round(n/T*100)} %</text>
    </svg>
    <h1>${headline}</h1>
    <button class="btn primary" id="weiter">${rest?`Weiterlernen (${rest} offen)`:"Alle wiederholen"}</button>
  </section>
  <section class="sec">
    <h2 style="font-size:18px">Lernmodi</h2>
    <div class="mlist">${modes.map(m=>`<button data-m="${m.k}"><span class="ic">${IC[m.k]}</span><b>${m.t}</b><span class="arr">→</span></button>`).join("")}</div>
  </section>`;
  $("#weiter").onclick=()=>go("karten",{open:!!rest});
  $$(".mlist button").forEach(b=>b.onclick=()=>b.dataset.m==="karten"?go("karten"):go("spiele",{game:b.dataset.m}));
}

/* ---------- Einstellungen ---------- */
const BGS=[
 {k:"auto",t:"Automatisch"},
 {k:"grau",t:"Hellgrau",c:"#f5f6fa",m:"light"},
 {k:"weiss",t:"Weiß",c:"#ffffff",m:"light"},
 {k:"sand",t:"Sand",c:"#f3eee4",m:"light"},
 {k:"mint",t:"Mint",c:"#e6f3ec",m:"light"},
 {k:"himmel",t:"Himmel",c:"#e5eefb",m:"light"},
 {k:"lavendel",t:"Lavendel",c:"#eeebfa",m:"light"},
 {k:"rose",t:"Rosé",c:"#f9eaee",m:"light"},
 {k:"nacht",t:"Nachtblau",c:"#0f1224",m:"dark"}];
let bgKey="auto";
try{bgKey=localStorage.getItem("stilmittel-bg")||"auto";}catch(e){}
function applyBg(){if(!BGS.some(x=>x.k===bgKey))bgKey="auto";const o=BGS.find(x=>x.k===bgKey)||BGS[0],r=document.documentElement;
  if(o.k==="auto"){r.removeAttribute("data-bg");r.style.removeProperty("--bg");return;}
  r.setAttribute("data-bg",o.m);r.style.setProperty("--bg",o.c);}
applyBg();
let confirmReset=false;
function vSettings(){
  $("#view").innerHTML=`
  <section class="sec"><h2>Hintergrundfarbe</h2>
    <div class="box"><div class="swatches">${BGS.map(o=>`<button class="sw ${o.k===bgKey?"on":""}" data-k="${o.k}" aria-pressed="${o.k===bgKey}"><span class="dot ${o.k==="auto"?"auto":""}" ${o.c?`style="background:${o.c}"`:""}></span>${o.t}</button>`).join("")}</div>
    <p class="muted small" style="margin-top:12px">„Automatisch“ folgt dem hellen oder dunklen Modus deines Geräts.</p></div>
  </section>
  <section class="sec"><h2>Lernstand</h2>
    <div class="box set-row"><div><b>${nDone()} von ${D.length}</b> <span class="muted">als gekonnt abgehakt</span></div>
      ${confirmReset?`<div class="row"><span class="small">Wirklich alles löschen?</span><button class="btn bad sm" id="resYes">Ja, zurücksetzen</button><button class="btn sm" id="resNo">Abbrechen</button></div>`
      :`<button class="btn sm" id="res">Fortschritt zurücksetzen</button>`}</div>
  </section>`;
  $$(".sw").forEach(b=>b.onclick=()=>{bgKey=b.dataset.k;try{localStorage.setItem("stilmittel-bg",bgKey);}catch(e){}applyBg();vSettings();});
  if($("#res"))$("#res").onclick=()=>{confirmReset=true;vSettings();};
  if($("#resNo"))$("#resNo").onclick=()=>{confirmReset=false;vSettings();};
  if($("#resYes"))$("#resYes").onclick=()=>{S={done:{},st:{}};save();updProg();confirmReset=false;vSettings();};
}

/* ---------- Alle Begriffe ---------- */
let q="",openId=null;
function vListe(){
  $("#view").innerHTML=`<div class="sec">
    <div class="sec-h"><h2>Alle Begriffe</h2><span class="muted small">Kreis antippen zum Abhaken</span></div>
    <div class="tools"><div style="flex:1 1 240px"><input type="search" id="such" placeholder="Begriff suchen" value="${esc(q)}" aria-label="Begriff suchen"></div>${openToggle()}</div>
    <div class="list" id="lst"></div></div>`;
  const draw=()=>{const f=norm(q);const L=pool(onlyOpen).filter(d=>!f||norm(d.n).includes(f));
    $("#lst").innerHTML=L.map(d=>{const o=openId===d.id||L.length===1;return `<div class="item ${isDone(d.id)?"done":""}" data-id="${d.id}">
      <button class="tick" aria-label="${esc(d.n)} als gekonnt markieren" aria-pressed="${isDone(d.id)}">✓</button>
      <div class="nm">${esc(d.n)}<small>${esc(d.a)}</small></div>
      <button class="btn ghost sm more" aria-expanded="${o}">${o?"Weniger":"Details"}</button>
      <div class="ex quote">${esc(d.b[0])}</div>
      ${o?`<div class="det"><p>${esc(d.e)}</p>${d.b.length>1?`<div class="quote muted">${d.b.slice(1).map(esc).join("<br>")}</div>`:""}${d.h?`<p class="muted small">Herkunft: ${esc(d.h)}</p>`:""}</div>`:""}
    </div>`}).join("")||`<p class="muted" style="padding:16px">Kein Begriff gefunden.</p>`;};
  draw();
  $("#such").oninput=e=>{q=e.target.value;openId=null;draw();};
  bindOpen(vListe);
  $("#lst").onclick=e=>{const it=e.target.closest(".item");if(!it)return;const id=+it.dataset.id;
    if(e.target.closest(".tick")){setDone(id,!isDone(id));draw();}
    else if(e.target.closest(".more")){openId=openId===id?null:id;if(q&&openId===null)q="";draw();if(!q)$("#such").value="";}};
}

/* ---------- Lernkarten ---------- */
let deck=[],ci=0,richtung="name";
function newDeck(){deck=shuffle(pool(onlyOpen));ci=0;}
function vKarten(){
  if(!deck.length)newDeck();
  const d=deck[ci];
  const front=richtung==="name"
    ?`<div class="lbl">Begriff</div><div class="big">${esc(d.n)}</div><p class="muted small">Tippe, um die Erklärung zu sehen</p>`
    :`<div class="lbl">Welches Stilmittel ist das?</div><div class="fq quote">${d.b.map(x=>`<div>${mask(x,d)}</div>`).join("")}</div><p class="muted small">Tippe, um die Lösung zu sehen</p>`;
  const back=`<div class="lbl">${isDone(d.id)?'<span style="color:var(--good)">Gekonnt ✓</span>':"Lösung"}</div>
    <h2 style="font-size:28px">${esc(d.n)} <span class="muted small" style="font-family:var(--f-body);font-weight:400">${esc(d.a)}</span></h2>
    <p>${esc(d.e)}</p><div class="quote muted">${d.b.map(x=>`<div>${esc(x)}</div>`).join("")}</div>${d.h?`<p class="muted small">Herkunft: ${esc(d.h)}</p>`:""}`;
  $("#view").innerHTML=`<div class="sec">
    <div class="tools"><div class="seg"><button id="r1" class="${richtung==="name"?"on":""}">Begriff vorne</button><button id="r2" class="${richtung==="bsp"?"on":""}">Beispiel vorne</button></div>${openToggle()}</div>
    <div class="row"><span class="counter">Karte ${ci+1} von ${deck.length}</span><div class="bar cbar"><i style="width:${(ci+1)/deck.length*100}%;background:var(--accent)"></i></div></div>
    <div class="card" id="card" tabindex="0" role="button" aria-label="Karte umdrehen"><div class="card-in"><div class="face front">${front}</div><div class="face back">${back}</div></div></div>
    <div class="ctl"><button class="btn bad" id="nein">Noch nicht</button><button class="btn good" id="ja">Kann ich ✓</button></div>
    <div class="ctl"><button class="btn ghost sm" id="prev">← Zurück</button><button class="btn ghost sm" id="mix">Neu mischen</button><button class="btn ghost sm" id="next">Überspringen →</button></div></div>`;
  const card=$("#card");const flip=()=>card.classList.toggle("flip");
  card.onclick=flip;card.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}};
  const step=k=>{ci=(ci+k+deck.length)%deck.length;vKarten();};
  $("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
  $("#ja").onclick=()=>{rec(d.id,true);setDone(d.id,true);step(1);};
  $("#nein").onclick=()=>{rec(d.id,false);setDone(d.id,false);step(1);};
  $("#mix").onclick=()=>{newDeck();vKarten();};
  $("#r1").onclick=()=>{richtung="name";vKarten();};$("#r2").onclick=()=>{richtung="bsp";vKarten();};
  bindOpen(()=>{newDeck();vKarten();});
}

/* ---------- Spiele ---------- */
const GAMES=[{k:"bsp",t:"Erkennen"},{k:"erk",t:"Definition"},{k:"tipp",t:"Eintippen"},{k:"mem",t:"Paare finden"}];
let game="bsp",G=null;
const ROUND=10;
function vSpiele(){
  $("#view").innerHTML=`<div class="sec">
    <div class="tools"><div class="seg games-seg">${GAMES.map(g=>`<button class="${g.k===game?"on":""}" data-g="${g.k}">${g.t}</button>`).join("")}</div>${openToggle()}</div>
    <div class="box"><div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="lbl" id="gt"></span><span class="score" id="sc"></span></div><div id="gp"></div></div></div>`;
  $$(".seg button").forEach(b=>b.onclick=()=>{game=b.dataset.g;G=null;vSpiele();});
  bindOpen(()=>{G=null;vSpiele();});
  if(!G||G.k!==game)G={k:game,r:0,n:0};
  ({bsp:quiz,erk:quiz,tipp:tipp,mem:mem})[game]();
}
function score(){$("#sc").textContent=G.n?`${G.r} von ${G.n} richtig`:`Frage 1 von ${ROUND}`;}
function endScreen(){const p=Math.round(G.r/G.n*100);$("#gt").textContent="Ergebnis";
  $("#gp").innerHTML=`<div class="end"><div class="big">${G.r} / ${G.n}</div>
   <p>${p>=90?"Stark! Fast alles sitzt.":p>=60?"Gut! Die falschen kommen ab jetzt öfter dran.":"Schau dir die Lernkarten nochmal an und versuch es dann erneut."}</p>
   <div class="row" style="justify-content:center"><button class="btn primary" id="again">Neue Runde</button><button class="btn" id="toStart">Zur Startseite</button></div></div>`;
  $("#again").onclick=()=>{G={k:game,r:0,n:0};vSpiele();};$("#toStart").onclick=()=>go("start");}
function quiz(){
  score(); if(G.n>=ROUND)return endScreen();
  const d=weighted(pool(onlyOpen));
  const opts=shuffle([d,...shuffle(D.filter(x=>x.id!==d.id)).slice(0,3)]);
  $("#gt").textContent=game==="bsp"?"Welches Stilmittel steckt hier drin?":"Welcher Begriff passt zur Erklärung?";
  $("#gp").innerHTML=(game==="bsp"?`<div class="q quote">${mask(pick(d.b),d)}</div>`:`<div class="q">${mask(d.e,d)}</div>`)
    +`<div class="opts">${opts.map(o=>`<button class="btn" data-id="${o.id}">${esc(o.n)}</button>`).join("")}</div><div id="fb"></div>`;
  $$(".opts button").forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.id===d.id;G.n++;if(ok)G.r++;rec(d.id,ok);
    $$(".opts button").forEach(x=>{x.disabled=true;if(+x.dataset.id===d.id)x.classList.add("good");else if(x===b)x.classList.add("bad");});
    $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Richtig!":"Leider falsch."}</b> ${esc(d.n)}: ${esc(d.e)}</div>
      <div class="ctl" style="margin-top:14px;justify-content:flex-end">${!isDone(d.id)&&ok?`<button class="btn good" id="abh">Als gekonnt abhaken</button>`:""}<button class="btn primary" id="wei">${G.n>=ROUND?"Ergebnis":"Nächste Frage"} →</button></div>`;
    $("#sc").textContent=`${G.r} von ${G.n} richtig`;
    if($("#abh"))$("#abh").onclick=e=>{setDone(d.id,true);e.target.remove();};
    $("#wei").onclick=quiz;$("#wei").focus();
  });
}
function tipp(){
  score(); if(G.n>=ROUND)return endScreen();
  const d=weighted(pool(onlyOpen)),showEx=Math.random()<.5;
  $("#gt").textContent=showEx?"Wie heißt das Stilmittel im Beispiel?":"Wie heißt der Begriff zur Erklärung?";
  $("#gp").innerHTML=`<div class="q ${showEx?"quote":""}">${showEx?mask(pick(d.b),d):mask(d.e,d)}</div>
    <form id="tf" class="row" autocomplete="off"><div style="flex:1 1 220px"><input type="text" id="ans" placeholder="Fachbegriff eingeben" aria-label="Antwort"></div>
    <button class="btn primary" type="submit">Prüfen</button><button class="btn" type="button" id="tipBtn">Tipp</button></form><div id="fb"></div>`;
  const inp=$("#ans");inp.focus();
  $("#tipBtn").onclick=()=>{inp.placeholder=d.n.slice(0,2)+"… ("+d.n.length+" Zeichen)";inp.focus();};
  $("#tf").onsubmit=e=>{e.preventDefault();if(!inp.value.trim())return;
    const a=norm(inp.value),ok=[d.n,...(d.alt||[])].some(x=>norm(x)===a);
    G.n++;if(ok)G.r++;rec(d.id,ok);inp.disabled=true;$$("#tf button").forEach(b=>b.disabled=true);
    $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Richtig!":"Gesucht war: "+esc(d.n)}</b> ${esc(d.e)}</div>
      <div class="ctl" style="margin-top:14px;justify-content:flex-end"><button class="btn primary" id="wei">${G.n>=ROUND?"Ergebnis":"Weiter"} →</button></div>`;
    $("#sc").textContent=`${G.r} von ${G.n} richtig`;$("#wei").onclick=tipp;$("#wei").focus();};
}
function mem(){
  if(!G.tiles){const sel=shuffle(pool(onlyOpen)).slice(0,6);
    G.tiles=shuffle(sel.flatMap(d=>{const ex=d.b[0].length>110?d.b[0].slice(0,105)+"…“":d.b[0];return [{id:d.id,t:"n",h:esc(d.n)},{id:d.id,t:"e",h:mask(ex,d)}];}));
    G.sel=null;G.found=0;G.tries=0;}
  $("#gt").textContent="Begriff und passendes Beispiel antippen";
  $("#sc").textContent=`${G.found} von 6 Paaren · ${G.tries} Versuche`;
  $("#gp").innerHTML=G.found===6
    ?`<div class="end"><div class="big">Alle Paare gefunden</div><p>Geschafft mit ${G.tries} Versuchen.</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Neues Spiel</button><button class="btn" id="toStart">Zur Startseite</button></div></div>`
    :`<div class="mem">${G.tiles.map((t,i)=>`<button class="tile ${t.t} ${t.ok?"ok":""} ${G.sel===i?"sel":""}" data-i="${i}" ${t.ok?"disabled":""}>${t.h}</button>`).join("")}</div>`;
  if($("#again")){$("#again").onclick=()=>{G={k:"mem"};vSpiele();};$("#toStart").onclick=()=>go("start");}
  $$(".tile").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,t=G.tiles[i];
    if(G.sel===null||G.tiles[G.sel].t===t.t){G.sel=i;return mem();}
    const a=G.tiles[G.sel];G.tries++;
    if(a.id===t.id){a.ok=t.ok=true;G.found++;rec(t.id,true);G.sel=null;mem();}
    else{rec(t.id,false);rec(a.id,false);const j=G.sel;G.sel=null;mem();
      [j,i].forEach(k=>$(`.tile[data-i="${k}"]`).classList.add("err"));
      setTimeout(()=>$$(".tile.err").forEach(x=>x.classList.remove("err")),600);}
  });
}

updProg();render();
</script>
